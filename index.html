<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OfertaBot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #171923;
      padding: 30px 20px;
      text-align: center;
      border-bottom: 1px solid #292d3a;
    }

    header h1 {
      color: #00e676;
      font-size: 32px;
      margin-bottom: 10px;
    }

    header p {
      color: #aaa;
      font-size: 16px;
    }

    main {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 30px 20px;
    }

    .card {
      background: #171923;
      border: 1px solid #292d3a;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .card h2 {
      color: #00e676;
      margin-bottom: 10px;
    }

    .card p {
      color: #ccc;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #3a3f4d;
      border-radius: 10px;
      background: #0f1117;
      color: white;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #00e676;
      color: #000;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00c853;
    }

    #resultado {
      margin-top: 20px;
      display: none;
    }

    .oferta {
      background: #0f1117;
      border: 1px solid #292d3a;
      border-radius: 12px;
      padding: 18px;
      margin-top: 12px;
    }

    .oferta h3 {
      color: white;
      margin-bottom: 8px;
    }

    .preco {
      color: #00e676;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .link {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #00e676;
      color: #000;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 30px 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🤖 OfertaBot</h1>
    <p>Encontre ofertas de forma rápida e fácil</p>
  </header>

  <main>

    <div class="card">
      <h2>🔎 Procurar oferta</h2>

      <p>
        Digite o nome do produto que você está procurando.
      </p>

      <input
        type="text"
        id="produto"
        placeholder="Ex: celular, notebook, fone..."
      >

      <button onclick="buscarOferta()">
        Procurar oferta
      </button>

      <div id="resultado"></div>
    </div>

  </main>

  <footer>
    OfertaBot © 2026
  </footer>

  <script>
    function buscarOferta() {
      const produto = document.getElementById("produto").value.trim();
      const resultado = document.getElementById("resultado");

        resultado.style.display = "block";
        resultado.innerHTML =
          "<p style='color:#ff5252;'>Digite um produto primeiro.</p>";

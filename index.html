<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OfertaBot</title>

    * {

      border-bottom: 1px solid #292b35;
    }

    header h1 {
      margin: 0;
      font-size: 48px;
      color: #00e676;

    header p {
      margin-top: 20px;
      font-size: 21px;
      color: #b8b8bd;
    }

    .container {

      background: #0e0f14;
      color: white;
      font-size: 19px;
      outline: none;
    }

    input:focus {
      border-color: #00e676;
    }

    button {
      width: 100%;
      padding: 20px;
      margin-top: 20px;
      border: none;
      border-radius: 18px;
      background: #00e676;
      color: #000;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00c965;
    }
